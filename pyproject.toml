[project]
name = "okta-access-review"
version = "0.1.0"
description = "Read-only Okta user access review with SOC 2 / ISO 27001 control mapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyjwt[crypto]>=2.9",
    "reportlab>=5.0.1",
]

[project.scripts]
access-review = "access_review.cli:main"

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_review"]

[tool.uv]
# Ignore packages published after this date so a new upstream release can't
# change what gets installed without a reviewed commit. Bump deliberately.
exclude-newer = "2026-09-16T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
